# Development overrides — publish debug ports and use development settings.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Do not use this file for production-oriented demos.

services:
  db:
    # Published for local DB tooling only (never use this file for production demos).
    ports:
      - "5432:5432"

  backend:
    environment:
      APP_ENV: development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"

  frontend:
    environment:
      # Runtime env is unused by static Nginx build; documented for clarity.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
