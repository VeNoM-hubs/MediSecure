apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: medisecure-backend
  namespace: medisecure
spec:
  podSelector:
    matchLabels:
      app: medisecure-backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: medisecure-frontend
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: medisecure-db
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: UDP
          port: 53
