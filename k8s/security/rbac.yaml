apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisecure-backend
  namespace: medisecure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: medisecure-backend-role
  namespace: medisecure
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: medisecure-backend-binding
  namespace: medisecure
subjects:
  - kind: ServiceAccount
    name: medisecure-backend
    namespace: medisecure
roleRef:
  kind: Role
  name: medisecure-backend-role
  apiGroup: rbac.authorization.k8s.io
