apiVersion: apps/v1
kind: Deployment
metadata:
  name: medisecure-frontend
  namespace: medisecure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medisecure-frontend
  template:
    metadata:
      labels:
        app: medisecure-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: medisecure/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: medisecure-frontend
  namespace: medisecure
spec:
  selector:
    app: medisecure-frontend
  ports:
    - port: 80
      targetPort: 8080
