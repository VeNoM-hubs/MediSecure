apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medisecure
  namespace: medisecure
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: medisecure.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: medisecure-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medisecure-frontend
                port:
                  number: 80
