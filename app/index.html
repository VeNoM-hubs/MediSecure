<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MediSecure — Healthcare Demo</title>
  <style>
    :root {
      --brand: #0b6e99;
      --brand-dark: #085578;
      --brand-soft: #e6f4fa;
      --ink: #0f2430;
      --muted: #5b7380;
      --line: #d7e3ea;
      --panel: #ffffff;
      --bg: #f3f8fb;
      --danger: #c0392b;
      --success: #1e7a46;
      --warn: #b7791f;
      --shadow: 0 10px 30px rgba(11, 49, 66, 0.08);
      --radius: 14px;
      --sidebar: 250px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(circle at top right, #d9eef8 0, transparent 40%),
        linear-gradient(180deg, #eef6fa 0%, var(--bg) 45%, #e8f1f6 100%);
    }
    button, input, select, textarea { font: inherit; }
    a { color: var(--brand); }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }

    /* Login */
    #login-screen {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .login-card {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }
    .brand {
      font-size: 2rem; font-weight: 700; letter-spacing: -0.03em;
      color: var(--brand-dark); text-align: center; margin: 0;
    }
    .subtitle { text-align: center; color: var(--muted); margin: 8px 0 24px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 10px;
      padding: 11px 12px; background: #fff; outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(11, 110, 153, 0.15);
    }
    .error { color: var(--danger); font-size: 0.85rem; margin-top: 6px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: none; border-radius: 10px; padding: 11px 16px; font-weight: 650;
      cursor: pointer; transition: 0.15s ease;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--brand); color: #fff; width: 100%; }
    .btn-primary:hover:not(:disabled) { background: var(--brand-dark); }
    .btn-secondary { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .btn-secondary:hover:not(:disabled) { background: var(--brand-soft); }
    .btn-danger { background: #fdecea; color: var(--danger); border: 1px solid #f5c6c2; }
    .btn-sm { padding: 7px 11px; font-size: 0.85rem; width: auto; }
    .demo-box {
      margin-top: 18px; padding: 12px 14px; border-radius: 12px;
      background: var(--brand-soft); color: var(--brand-dark); font-size: 0.86rem;
    }
    .demo-box strong { display: block; margin-bottom: 6px; }
    .demo-box code { background: #fff; padding: 1px 5px; border-radius: 4px; }

    /* App shell */
    #app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) 1fr; }
    .sidebar {
      background: linear-gradient(180deg, #0a4f6e, #0b6e99);
      color: #fff; padding: 20px 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .sidebar .logo { font-size: 1.35rem; font-weight: 700; padding: 8px 10px 18px; }
    .sidebar .user-chip {
      background: rgba(255,255,255,0.12); border-radius: 12px; padding: 12px;
      margin-bottom: 10px; font-size: 0.9rem;
    }
    .sidebar .user-chip small { opacity: 0.8; text-transform: capitalize; }
    .nav-btn {
      text-align: left; background: transparent; border: 0; color: #fff;
      padding: 11px 12px; border-radius: 10px; cursor: pointer; font-weight: 600;
    }
    .nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,0.16); }
    .sidebar .spacer { flex: 1; }
    .main { padding: 24px; min-width: 0; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
    }
    .topbar h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.02em; }
    .menu-toggle {
      display: none; background: #fff; border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px; cursor: pointer; font-weight: 650;
    }
    .grid { display: grid; gap: 14px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px;
    }
    .stat .label { color: var(--muted); font-size: 0.85rem; }
    .stat .value { font-size: 1.8rem; font-weight: 750; margin-top: 6px; color: var(--brand-dark); }
    .section-title {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin: 0 0 12px; flex-wrap: wrap;
    }
    .section-title h2 { margin: 0; font-size: 1.1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 650; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge {
      display: inline-block; border-radius: 999px; padding: 3px 9px;
      font-size: 0.75rem; font-weight: 700; text-transform: capitalize;
    }
    .badge-pending { background: #fff4e0; color: var(--warn); }
    .badge-confirmed { background: #e4f7ec; color: var(--success); }
    .badge-completed { background: var(--brand-soft); color: var(--brand-dark); }
    .badge-cancelled, .badge-rejected { background: #fdecea; color: var(--danger); }
    .badge-unread { background: #fff4e0; color: var(--warn); }
    .badge-read { background: #eef2f4; color: var(--muted); }
    .empty {
      text-align: center; color: var(--muted); padding: 28px 12px;
      border: 1px dashed var(--line); border-radius: 12px;
    }
    .row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .toast-wrap {
      position: fixed; right: 16px; bottom: 16px; z-index: 50;
      display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 24px));
    }
    .toast {
      background: #0f2430; color: #fff; padding: 12px 14px; border-radius: 12px;
      box-shadow: var(--shadow); animation: rise 0.2s ease;
    }
    .toast.ok { background: #145c3a; }
    .toast.err { background: #8f2a22; }
    @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15, 36, 48, 0.45);
      display: grid; place-items: center; padding: 16px; z-index: 40;
    }
    .modal {
      width: min(520px, 100%); background: #fff; border-radius: 16px;
      padding: 20px; box-shadow: var(--shadow);
    }
    .modal h3 { margin: 0 0 8px; }
    .modal p { color: var(--muted); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .list-item {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px;
      margin-bottom: 10px; background: #fff;
    }
    .list-item h4 { margin: 0 0 4px; font-size: 1rem; }
    .list-item p { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .stack { display: grid; gap: 12px; }
    .form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

    @media (max-width: 980px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 800px) {
      #app-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; inset: 0 auto 0 0; width: min(82vw, 280px);
        transform: translateX(-105%); transition: transform 0.2s ease; z-index: 30;
      }
      .sidebar.open { transform: none; }
      .menu-toggle { display: inline-flex; }
      .backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 25;
      }
      .table-wrap { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div id="login-screen">
    <div class="login-card">
      <h1 class="brand">MediSecure</h1>
      <p class="subtitle">Sign in to your secure healthcare portal</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
          <div class="error" id="email-error"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <div class="error" id="password-error"></div>
        </div>
        <div class="error" id="login-error"></div>
        <button class="btn btn-primary" type="submit">Sign in</button>
      </form>
      <div class="demo-box" aria-label="Demo credentials">
        <strong>Demo credentials (synthetic data only)</strong>
        Patient: <code>patient.one@medisecure.demo</code> / <code>12345678</code><br />
        Doctor: <code>dr.rivera@medisecure.demo</code> / <code>12345678</code><br />
        Admin: <code>bhaskar@gmail.com</code> / <code>12345678</code>
      </div>
    </div>
  </div>

  <div id="app-shell" class="hidden">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="logo">MediSecure</div>
      <div class="user-chip">
        <div id="sidebar-name">User</div>
        <small id="sidebar-role">role</small>
      </div>
      <nav id="nav" aria-label="Dashboard sections"></nav>
      <div class="spacer"></div>
      <button class="nav-btn" type="button" id="logout-btn">Log out</button>
    </aside>
    <div id="nav-backdrop" class="backdrop hidden" aria-hidden="true"></div>
    <main class="main">
      <div class="topbar">
        <button class="menu-toggle" type="button" id="menu-toggle" aria-label="Open menu">Menu</button>
        <h1 id="page-title">Overview</h1>
        <span id="unread-pill" class="badge badge-unread hidden">0 unread</span>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
(function () {
  "use strict";

  var STORAGE_KEY = "medisecure_static_demo_v1";
  var DEMO_PASSWORD = "12345678";

  var DEFAULT_USERS = [
    { id: "u-admin", email: "bhaskar@gmail.com", password: DEMO_PASSWORD, fullName: "Bhaskar", role: "admin", phone: "+1-555-0100" },
    { id: "u-doc1", email: "dr.rivera@medisecure.demo", password: DEMO_PASSWORD, fullName: "Dr. Maya Rivera", role: "doctor", specialty: "General Practice" },
    { id: "u-doc2", email: "dr.chen@medisecure.demo", password: DEMO_PASSWORD, fullName: "Dr. Wei Chen", role: "doctor", specialty: "Cardiology" },
    { id: "u-pat1", email: "patient.one@medisecure.demo", password: DEMO_PASSWORD, fullName: "Jordan Lee", role: "patient", dob: "1990-04-12", bloodType: "O+" },
    { id: "u-pat2", email: "patient.two@medisecure.demo", password: DEMO_PASSWORD, fullName: "Sam Patel", role: "patient", dob: "1985-11-03", bloodType: "A-" }
  ];

  function daysFromNow(n, hour) {
    var d = new Date();
    d.setDate(d.getDate() + n);
    d.setHours(hour || 10, 0, 0, 0);
    return d.toISOString();
  }

  function seedData() {
    return {
      users: DEFAULT_USERS.slice(),
      appointments: [
        { id: "a1", patientId: "u-pat1", doctorId: "u-doc1", when: daysFromNow(2, 9), status: "confirmed", reason: "Annual wellness checkup (synthetic)" },
        { id: "a2", patientId: "u-pat1", doctorId: "u-doc2", when: daysFromNow(-5, 14), status: "completed", reason: "Follow-up consult (synthetic)" },
        { id: "a3", patientId: "u-pat2", doctorId: "u-doc1", when: daysFromNow(1, 11), status: "pending", reason: "Skin rash evaluation (synthetic)" },
        { id: "a4", patientId: "u-pat2", doctorId: "u-doc2", when: daysFromNow(4, 15), status: "confirmed", reason: "Blood pressure review (synthetic)" }
      ],
      records: [
        { id: "r1", patientId: "u-pat1", doctorId: "u-doc1", title: "Baseline wellness summary", diagnosis: "Healthy — synthetic baseline", notes: "Fictional record for academic demo only.", createdAt: daysFromNow(-5, 15) },
        { id: "r2", patientId: "u-pat2", doctorId: "u-doc2", title: "Cardiology note", diagnosis: "Mild hypertension (synthetic)", notes: "Lifestyle counseling recommended.", createdAt: daysFromNow(-2, 16) }
      ],
      notifications: [
        { id: "n1", userId: "u-pat1", title: "Appointment confirmed", message: "Your visit with Dr. Maya Rivera is confirmed.", read: false, createdAt: daysFromNow(-1, 9) },
        { id: "n2", userId: "u-doc1", title: "New appointment request", message: "Sam Patel requested an appointment.", read: false, createdAt: daysFromNow(0, 8) },
        { id: "n3", userId: "u-admin", title: "System welcome", message: "MediSecure demo uses synthetic healthcare data only.", read: true, createdAt: daysFromNow(-10, 12) }
      ],
      session: null
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        var fresh = seedData();
        saveState(fresh);
        return fresh;
      }
      var parsed = JSON.parse(raw);
      if (!parsed.users || !parsed.appointments) throw new Error("invalid");
      return parsed;
    } catch (e) {
      var reset = seedData();
      saveState(reset);
      return reset;
    }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  var state = loadState();
  var currentView = "overview";

  function uid(prefix) {
    return prefix + "-" + Math.random().toString(36).slice(2, 9);
  }

  function toast(message, type) {
    var el = document.createElement("div");
    el.className = "toast " + (type || "");
    el.textContent = message;
    document.getElementById("toasts").appendChild(el);
    setTimeout(function () { el.remove(); }, 2800);
  }

  function formatWhen(iso) {
    try {
      return new Date(iso).toLocaleString(undefined, {
        weekday: "short", year: "numeric", month: "short", day: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
    } catch (e) { return iso; }
  }

  function userById(id) {
    return state.users.find(function (u) { return u.id === id; });
  }

  function doctors() {
    return state.users.filter(function (u) { return u.role === "doctor"; });
  }

  function patients() {
    return state.users.filter(function (u) { return u.role === "patient"; });
  }

  function sessionUser() {
    return state.session ? userById(state.session.userId) : null;
  }

  function unreadCount(userId) {
    return state.notifications.filter(function (n) { return n.userId === userId && !n.read; }).length;
  }

  function addNotification(userId, title, message) {
    state.notifications.unshift({
      id: uid("n"), userId: userId, title: title, message: message,
      read: false, createdAt: new Date().toISOString()
    });
  }

  function confirmDialog(title, message, onYes) {
    var root = document.getElementById("modal-root");
    root.innerHTML =
      '<div class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<div class="modal"><h3 id="modal-title"></h3><p id="modal-msg"></p>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn btn-secondary btn-sm" id="modal-cancel">Cancel</button>' +
      '<button type="button" class="btn btn-danger btn-sm" id="modal-ok">Confirm</button>' +
      "</div></div></div>";
    root.querySelector("#modal-title").textContent = title;
    root.querySelector("#modal-msg").textContent = message;
    root.querySelector("#modal-cancel").onclick = function () { root.innerHTML = ""; };
    root.querySelector("#modal-ok").onclick = function () {
      root.innerHTML = "";
      onYes();
    };
  }

  function badge(status) {
    return '<span class="badge badge-' + status + '">' + status + "</span>";
  }

  function emptyState(text) {
    return '<div class="empty">' + text + "</div>";
  }

  var NAV = {
    patient: [
      { id: "overview", label: "Overview" },
      { id: "appointments", label: "Appointments" },
      { id: "records", label: "Medical records" },
      { id: "notifications", label: "Notifications" },
      { id: "profile", label: "Profile" }
    ],
    doctor: [
      { id: "overview", label: "Overview" },
      { id: "appointments", label: "Appointments" },
      { id: "patients", label: "Patients" },
      { id: "records", label: "Medical records" },
      { id: "notifications", label: "Notifications" }
    ],
    admin: [
      { id: "overview", label: "Overview" },
      { id: "users", label: "Users" },
      { id: "appointments", label: "Appointments" },
      { id: "notifications", label: "Notifications" }
    ]
  };

  function renderNav() {
    var user = sessionUser();
    var nav = document.getElementById("nav");
    nav.innerHTML = "";
    (NAV[user.role] || []).forEach(function (item) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nav-btn" + (currentView === item.id ? " active" : "");
      btn.textContent = item.label;
      btn.onclick = function () {
        currentView = item.id;
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("nav-backdrop").classList.add("hidden");
        renderApp();
      };
      nav.appendChild(btn);
    });
  }

  function renderPatientOverview() {
    var user = sessionUser();
    var mine = state.appointments.filter(function (a) { return a.patientId === user.id; });
    var upcoming = mine.filter(function (a) { return new Date(a.when) >= new Date() && a.status !== "cancelled" && a.status !== "rejected"; });
    var myRecords = state.records.filter(function (r) { return r.patientId === user.id; });
    var unread = unreadCount(user.id);
    return (
      '<div class="grid grid-4">' +
        statCard("Upcoming", upcoming.length) +
        statCard("Total appointments", mine.length) +
        statCard("Medical records", myRecords.length) +
        statCard("Unread alerts", unread) +
      "</div>" +
      '<div class="grid grid-2" style="margin-top:14px">' +
        '<section class="card"><div class="section-title"><h2>Upcoming appointments</h2>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-go="appointments">Book / manage</button></div>' +
        appointmentList(upcoming.slice(0, 4), true) +
        "</section>" +
        '<section class="card"><div class="section-title"><h2>Available doctors</h2></div>' +
        doctorQuickList() +
        "</section>" +
        '<section class="card"><div class="section-title"><h2>Recent records</h2></div>' +
        recordList(myRecords.slice(0, 3)) +
        "</section>" +
        '<section class="card"><div class="section-title"><h2>Unread notifications</h2></div>' +
        notificationList(state.notifications.filter(function (n) { return n.userId === user.id && !n.read; }).slice(0, 4)) +
        "</section>" +
      "</div>"
    );
  }

  function renderDoctorOverview() {
    var user = sessionUser();
    var mine = state.appointments.filter(function (a) { return a.doctorId === user.id; });
    var today = mine.filter(function (a) {
      var d = new Date(a.when); var n = new Date();
      return d.toDateString() === n.toDateString() && a.status !== "cancelled";
    });
    var pending = mine.filter(function (a) { return a.status === "pending"; });
    var completed = mine.filter(function (a) { return a.status === "completed"; });
    var upcoming = mine.filter(function (a) {
      return new Date(a.when) >= new Date() && (a.status === "confirmed" || a.status === "pending");
    });
    return (
      '<div class="grid grid-4">' +
        statCard("Today", today.length) +
        statCard("Upcoming", upcoming.length) +
        statCard("Pending requests", pending.length) +
        statCard("Completed", completed.length) +
      "</div>" +
      '<div class="grid grid-2" style="margin-top:14px">' +
        '<section class="card"><div class="section-title"><h2>Today\'s appointments</h2></div>' +
        appointmentList(today, false) + "</section>" +
        '<section class="card"><div class="section-title"><h2>Pending requests</h2></div>' +
        appointmentList(pending, false) + "</section>" +
      "</div>"
    );
  }

  function renderAdminOverview() {
    var appts = state.appointments;
    return (
      '<div class="grid grid-4">' +
        statCard("Patients", patients().length) +
        statCard("Doctors", doctors().length) +
        statCard("Appointments", appts.length) +
        statCard("Pending", appts.filter(function (a) { return a.status === "pending"; }).length) +
      "</div>" +
      '<div class="grid grid-2" style="margin-top:14px">' +
        '<section class="card"><div class="section-title"><h2>Status breakdown</h2></div>' +
        '<p>Completed: <strong>' + appts.filter(function (a) { return a.status === "completed"; }).length + "</strong></p>" +
        '<p>Cancelled: <strong>' + appts.filter(function (a) { return a.status === "cancelled"; }).length + "</strong></p>" +
        '<p>Confirmed: <strong>' + appts.filter(function (a) { return a.status === "confirmed"; }).length + "</strong></p>" +
        "</section>" +
        '<section class="card"><div class="section-title"><h2>Recent activity</h2></div>' +
        notificationList(state.notifications.slice(0, 6)) +
        "</section>" +
      "</div>"
    );
  }

  function statCard(label, value) {
    return '<div class="card stat"><div class="label">' + label + '</div><div class="value">' + value + "</div></div>";
  }

  function appointmentList(items, showDoctor) {
    if (!items.length) return emptyState("No appointments to show.");
    var user = sessionUser();
    var rows = items.map(function (a) {
      var peer = showDoctor ? userById(a.doctorId) : userById(a.patientId);
      var actions = "";
      if (user.role === "patient" && (a.status === "pending" || a.status === "confirmed")) {
        actions = '<button class="btn btn-danger btn-sm" data-cancel="' + a.id + '">Cancel</button>';
      }
      if (user.role === "doctor" && a.status === "pending") {
        actions =
          '<button class="btn btn-primary btn-sm" data-status="' + a.id + ':confirmed">Accept</button>' +
          '<button class="btn btn-danger btn-sm" data-status="' + a.id + ':rejected">Reject</button>';
      }
      if (user.role === "doctor" && a.status === "confirmed") {
        actions += '<button class="btn btn-secondary btn-sm" data-status="' + a.id + ':completed">Complete</button>';
      }
      if (user.role === "admin" && a.status !== "cancelled") {
        actions += '<button class="btn btn-danger btn-sm" data-cancel="' + a.id + '">Cancel</button>';
      }
      return "<tr>" +
        "<td>" + (peer ? peer.fullName : "—") + "</td>" +
        "<td>" + formatWhen(a.when) + "</td>" +
        "<td>" + (a.reason || "—") + "</td>" +
        "<td>" + badge(a.status) + "</td>" +
        '<td><div class="row-actions">' + actions + "</div></td>" +
        "</tr>";
    }).join("");
    return '<div class="table-wrap"><table><thead><tr>' +
      "<th>" + (showDoctor ? "Doctor" : "Patient") + "</th><th>When</th><th>Reason</th><th>Status</th><th>Actions</th>" +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  function doctorQuickList() {
    return doctors().map(function (d) {
      return '<div class="list-item"><h4>' + d.fullName + "</h4><p>" + (d.specialty || "Physician") +
        '</p><div class="form-actions"><button class="btn btn-primary btn-sm" type="button" data-book="' + d.id + '">Book</button></div></div>';
    }).join("") || emptyState("No doctors available.");
  }

  function recordList(items) {
    if (!items.length) return emptyState("No medical records yet.");
    return items.map(function (r) {
      var doc = userById(r.doctorId);
      var pat = userById(r.patientId);
      return '<div class="list-item"><h4>' + r.title + "</h4>" +
        "<p>Patient: " + (pat ? pat.fullName : "—") + " · Doctor: " + (doc ? doc.fullName : "—") + "</p>" +
        "<p>Diagnosis: " + (r.diagnosis || "—") + "</p>" +
        "<p>" + (r.notes || "") + "</p></div>";
    }).join("");
  }

  function notificationList(items) {
    if (!items.length) return emptyState("You're all caught up.");
    return items.map(function (n) {
      return '<div class="list-item"><h4>' + n.title + " " + badge(n.read ? "read" : "unread") + "</h4>" +
        "<p>" + n.message + "</p><p>" + formatWhen(n.createdAt) + "</p>" +
        (n.read ? "" : '<div class="form-actions"><button class="btn btn-secondary btn-sm" data-read="' + n.id + '">Mark read</button></div>') +
        "</div>";
    }).join("");
  }

  function renderAppointments() {
    var user = sessionUser();
    var items = state.appointments.filter(function (a) {
      if (user.role === "patient") return a.patientId === user.id;
      if (user.role === "doctor") return a.doctorId === user.id;
      return true;
    }).sort(function (a, b) { return new Date(a.when) - new Date(b.when); });

    var bookForm = "";
    if (user.role === "patient") {
      bookForm =
        '<section class="card" style="margin-bottom:14px"><div class="section-title"><h2>Book appointment</h2></div>' +
        '<form id="book-form" class="stack" novalidate>' +
        '<div class="field"><label for="book-doctor">Doctor</label><select id="book-doctor" required>' +
        doctors().map(function (d) { return '<option value="' + d.id + '">' + d.fullName + " — " + (d.specialty || "") + "</option>"; }).join("") +
        '</select><div class="error" id="book-doctor-error"></div></div>' +
        '<div class="field"><label for="book-when">Date & time</label><input id="book-when" type="datetime-local" required />' +
        '<div class="error" id="book-when-error"></div></div>' +
        '<div class="field"><label for="book-reason">Reason</label><input id="book-reason" maxlength="200" placeholder="Synthetic reason" />' +
        '</div><button class="btn btn-primary" type="submit" style="width:auto">Request appointment</button></form></section>';
    }

    return bookForm +
      '<section class="card"><div class="section-title"><h2>All appointments</h2></div>' +
      appointmentList(items, user.role === "patient" || user.role === "admin") +
      "</section>";
  }

  function renderRecords() {
    var user = sessionUser();
    var items = state.records.filter(function (r) {
      if (user.role === "patient") return r.patientId === user.id;
      if (user.role === "doctor") return r.doctorId === user.id || true;
      return true;
    });
    if (user.role === "doctor") {
      items = state.records.filter(function (r) {
        return state.appointments.some(function (a) {
          return a.doctorId === user.id && a.patientId === r.patientId;
        });
      });
    }
    var form = "";
    if (user.role === "doctor") {
      var myPatients = patients().filter(function (p) {
        return state.appointments.some(function (a) { return a.doctorId === user.id && a.patientId === p.id; });
      });
      form =
        '<section class="card" style="margin-bottom:14px"><div class="section-title"><h2>Add consultation note</h2></div>' +
        '<form id="record-form" class="stack" novalidate>' +
        '<div class="field"><label for="rec-patient">Patient</label><select id="rec-patient" required>' +
        (myPatients.length ? myPatients.map(function (p) { return '<option value="' + p.id + '">' + p.fullName + "</option>"; }).join("") : '<option value="">No linked patients</option>') +
        '</select></div>' +
        '<div class="field"><label for="rec-title">Title</label><input id="rec-title" required minlength="2" /></div>' +
        '<div class="field"><label for="rec-dx">Diagnosis</label><input id="rec-dx" /></div>' +
        '<div class="field"><label for="rec-notes">Notes</label><textarea id="rec-notes" rows="3"></textarea></div>' +
        '<button class="btn btn-primary" type="submit" style="width:auto"' + (myPatients.length ? "" : " disabled") + ">Save note</button></form></section>";
    }
    return form + '<section class="card"><div class="section-title"><h2>Records</h2></div>' + recordList(items) + "</section>";
  }

  function renderNotifications() {
    var user = sessionUser();
    var items = state.notifications.filter(function (n) { return n.userId === user.id; });
    return '<section class="card"><div class="section-title"><h2>Notifications</h2>' +
      '<button class="btn btn-secondary btn-sm" type="button" id="read-all">Mark all read</button></div>' +
      notificationList(items) + "</section>";
  }

  function renderProfile() {
    var user = sessionUser();
    return '<section class="card"><div class="section-title"><h2>Profile</h2></div>' +
      '<form id="profile-form" class="stack" novalidate>' +
      '<div class="field"><label for="prof-name">Full name</label><input id="prof-name" value="' + escapeAttr(user.fullName) + '" required minlength="2" /></div>' +
      '<div class="field"><label for="prof-phone">Phone</label><input id="prof-phone" value="' + escapeAttr(user.phone || "") + '" /></div>' +
      (user.role === "patient" ?
        '<div class="field"><label for="prof-dob">Date of birth</label><input id="prof-dob" type="date" value="' + escapeAttr(user.dob || "") + '" /></div>' +
        '<div class="field"><label for="prof-blood">Blood type</label><input id="prof-blood" value="' + escapeAttr(user.bloodType || "") + '" /></div>'
        : "") +
      '<div class="error" id="profile-error"></div>' +
      '<button class="btn btn-primary" type="submit" style="width:auto">Save profile</button></form></section>';
  }

  function renderPatients() {
    var user = sessionUser();
    var linked = patients().filter(function (p) {
      return state.appointments.some(function (a) { return a.doctorId === user.id && a.patientId === p.id; });
    });
    if (!linked.length) return '<section class="card">' + emptyState("No patients linked via appointments yet.") + "</section>";
    return '<section class="card"><div class="section-title"><h2>Your patients</h2></div>' +
      linked.map(function (p) {
        return '<div class="list-item"><h4>' + p.fullName + "</h4><p>" + p.email +
          (p.dob ? " · DOB " + p.dob : "") + (p.bloodType ? " · " + p.bloodType : "") + "</p></div>";
      }).join("") + "</section>";
  }

  function renderUsers() {
    return '<section class="card"><div class="section-title"><h2>Registered users</h2></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>' +
      state.users.map(function (u) {
        return "<tr><td>" + u.fullName + "</td><td>" + u.email + "</td><td><span class=\"badge badge-completed\">" + u.role + "</span></td></tr>";
      }).join("") +
      "</tbody></table></div></section>";
  }

  function escapeAttr(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
  }

  function pageTitle(view) {
    var map = {
      overview: "Overview",
      appointments: "Appointments",
      records: "Medical records",
      notifications: "Notifications",
      profile: "Profile",
      patients: "Patients",
      users: "Users"
    };
    return map[view] || "Dashboard";
  }

  function renderView() {
    var user = sessionUser();
    if (currentView === "overview") {
      if (user.role === "patient") return renderPatientOverview();
      if (user.role === "doctor") return renderDoctorOverview();
      return renderAdminOverview();
    }
    if (currentView === "appointments") return renderAppointments();
    if (currentView === "records") return renderRecords();
    if (currentView === "notifications") return renderNotifications();
    if (currentView === "profile") return renderProfile();
    if (currentView === "patients") return renderPatients();
    if (currentView === "users") return renderUsers();
    return emptyState("Section not found.");
  }

  function bindViewEvents() {
    var view = document.getElementById("view");

    view.querySelectorAll("[data-go]").forEach(function (btn) {
      btn.onclick = function () {
        currentView = btn.getAttribute("data-go");
        renderApp();
      };
    });

    view.querySelectorAll("[data-book]").forEach(function (btn) {
      btn.onclick = function () {
        currentView = "appointments";
        renderApp();
        var select = document.getElementById("book-doctor");
        if (select) select.value = btn.getAttribute("data-book");
      };
    });

    view.querySelectorAll("[data-cancel]").forEach(function (btn) {
      btn.onclick = function () {
        var id = btn.getAttribute("data-cancel");
        confirmDialog("Cancel appointment", "Cancel this appointment? This cannot be undone in the demo.", function () {
          var appt = state.appointments.find(function (a) { return a.id === id; });
          if (!appt) return;
          appt.status = "cancelled";
          addNotification(appt.patientId, "Appointment cancelled", "An appointment was cancelled.");
          addNotification(appt.doctorId, "Appointment cancelled", "An appointment was cancelled.");
          saveState(state);
          toast("Appointment cancelled", "ok");
          renderApp();
        });
      };
    });

    view.querySelectorAll("[data-status]").forEach(function (btn) {
      btn.onclick = function () {
        var parts = btn.getAttribute("data-status").split(":");
        var appt = state.appointments.find(function (a) { return a.id === parts[0]; });
        if (!appt) return;
        appt.status = parts[1];
        addNotification(appt.patientId, "Appointment " + parts[1], "Your appointment status is now " + parts[1] + ".");
        saveState(state);
        toast("Status updated to " + parts[1], "ok");
        renderApp();
      };
    });

    view.querySelectorAll("[data-read]").forEach(function (btn) {
      btn.onclick = function () {
        var n = state.notifications.find(function (x) { return x.id === btn.getAttribute("data-read"); });
        if (n) n.read = true;
        saveState(state);
        renderApp();
      };
    });

    var readAll = document.getElementById("read-all");
    if (readAll) {
      readAll.onclick = function () {
        var user = sessionUser();
        state.notifications.forEach(function (n) {
          if (n.userId === user.id) n.read = true;
        });
        saveState(state);
        toast("All notifications marked read", "ok");
        renderApp();
      };
    }

    var bookForm = document.getElementById("book-form");
    if (bookForm) {
      bookForm.onsubmit = function (e) {
        e.preventDefault();
        var doctorId = document.getElementById("book-doctor").value;
        var whenEl = document.getElementById("book-when");
        var reason = document.getElementById("book-reason").value.trim();
        document.getElementById("book-doctor-error").textContent = "";
        document.getElementById("book-when-error").textContent = "";
        if (!doctorId) {
          document.getElementById("book-doctor-error").textContent = "Select a doctor.";
          return;
        }
        if (!whenEl.value) {
          document.getElementById("book-when-error").textContent = "Choose a date and time.";
          return;
        }
        var when = new Date(whenEl.value);
        if (isNaN(when.getTime()) || when < new Date()) {
          document.getElementById("book-when-error").textContent = "Pick a future date and time.";
          return;
        }
        var user = sessionUser();
        var appt = {
          id: uid("a"), patientId: user.id, doctorId: doctorId,
          when: when.toISOString(), status: "pending",
          reason: reason || "General consultation (synthetic)"
        };
        state.appointments.push(appt);
        addNotification(doctorId, "New appointment request", user.fullName + " requested an appointment.");
        addNotification(user.id, "Request submitted", "Your appointment request is pending confirmation.");
        saveState(state);
        toast("Appointment requested", "ok");
        renderApp();
      };
    }

    var recordForm = document.getElementById("record-form");
    if (recordForm) {
      recordForm.onsubmit = function (e) {
        e.preventDefault();
        var patientId = document.getElementById("rec-patient").value;
        var title = document.getElementById("rec-title").value.trim();
        if (!patientId || title.length < 2) {
          toast("Patient and title are required", "err");
          return;
        }
        var user = sessionUser();
        state.records.unshift({
          id: uid("r"), patientId: patientId, doctorId: user.id, title: title,
          diagnosis: document.getElementById("rec-dx").value.trim() || "Synthetic note",
          notes: document.getElementById("rec-notes").value.trim() || "Demo consultation note.",
          createdAt: new Date().toISOString()
        });
        addNotification(patientId, "New medical record", "A consultation note was added to your records.");
        saveState(state);
        toast("Consultation note saved", "ok");
        renderApp();
      };
    }

    var profileForm = document.getElementById("profile-form");
    if (profileForm) {
      profileForm.onsubmit = function (e) {
        e.preventDefault();
        var name = document.getElementById("prof-name").value.trim();
        var err = document.getElementById("profile-error");
        err.textContent = "";
        if (name.length < 2) {
          err.textContent = "Name must be at least 2 characters.";
          return;
        }
        var user = sessionUser();
        user.fullName = name;
        user.phone = document.getElementById("prof-phone").value.trim();
        if (user.role === "patient") {
          user.dob = document.getElementById("prof-dob").value;
          user.bloodType = document.getElementById("prof-blood").value.trim();
        }
        saveState(state);
        toast("Profile updated", "ok");
        renderApp();
      };
    }
  }

  function renderApp() {
    var user = sessionUser();
    if (!user) {
      showLogin();
      return;
    }
    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("app-shell").classList.remove("hidden");
    document.getElementById("sidebar-name").textContent = user.fullName;
    document.getElementById("sidebar-role").textContent = user.role;
    document.getElementById("page-title").textContent = pageTitle(currentView);
    var unread = unreadCount(user.id);
    var pill = document.getElementById("unread-pill");
    if (unread > 0) {
      pill.textContent = unread + " unread";
      pill.classList.remove("hidden");
    } else {
      pill.classList.add("hidden");
    }
    renderNav();
    document.getElementById("view").innerHTML = renderView();
    bindViewEvents();
  }

  function showLogin() {
    document.getElementById("app-shell").classList.add("hidden");
    document.getElementById("login-screen").classList.remove("hidden");
  }

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim().toLowerCase();
    var password = document.getElementById("password").value;
    document.getElementById("email-error").textContent = "";
    document.getElementById("password-error").textContent = "";
    document.getElementById("login-error").textContent = "";
    var valid = true;
    if (!email || email.indexOf("@") < 1) {
      document.getElementById("email-error").textContent = "Enter a valid email.";
      valid = false;
    }
    if (!password || password.length < 8) {
      document.getElementById("password-error").textContent = "Minimum 8 characters.";
      valid = false;
    }
    if (!valid) return;
    var user = state.users.find(function (u) {
      return u.email.toLowerCase() === email && u.password === password;
    });
    if (!user) {
      document.getElementById("login-error").textContent = "Invalid email or password.";
      return;
    }
    state.session = { userId: user.id };
    saveState(state);
    currentView = "overview";
    toast("Welcome, " + user.fullName, "ok");
    renderApp();
  });

  document.getElementById("logout-btn").addEventListener("click", function () {
    state.session = null;
    saveState(state);
    currentView = "overview";
    toast("Signed out", "ok");
    showLogin();
  });

  document.getElementById("menu-toggle").addEventListener("click", function () {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("nav-backdrop").classList.remove("hidden");
  });
  document.getElementById("nav-backdrop").addEventListener("click", function () {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("nav-backdrop").classList.add("hidden");
  });

  if (sessionUser()) renderApp();
  else showLogin();
})();
  </script>
</body>
</html>
