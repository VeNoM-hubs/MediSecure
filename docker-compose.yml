services:
  db:
    image: postgres:16.4-alpine
    container_name: medisecure-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medisecure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-medisecure}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medisecure} -d ${POSTGRES_DB:-medisecure}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medisecure-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisecure-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-medisecure}:${POSTGRES_PASSWORD:-change_me_local_only}@db:5432/${POSTGRES_DB:-medisecure}
      POSTGRES_HOST: db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medisecure-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: medisecure-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - medisecure-net

volumes:
  postgres_data:

networks:
  medisecure-net:
    driver: bridge
