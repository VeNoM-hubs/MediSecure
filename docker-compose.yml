# Production-oriented local demonstration stack.
# Secrets come from `.env` (copy from `.env.example`). Do not hardcode passwords here.
# Development overrides: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

name: medisecure

services:
  db:
    image: postgres:16.4-alpine
    container_name: medisecure-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - medisecure-net
    # PostgreSQL is intentionally not published to the host.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: medisecure-backend:local
    container_name: medisecure-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - medisecure-net
    # Backend is not published to the host by default (reach via frontend /api/).
    # For local API debugging, use docker-compose.dev.yml.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: medisecure-frontend:local
    container_name: medisecure-frontend
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - medisecure-net

volumes:
  postgres_data:
    name: medisecure_postgres_data

networks:
  medisecure-net:
    name: medisecure-net
    driver: bridge
